cross_cutting:
    - id: CC-1
      kind: cross_cutting
      title: OAuth Credential Safety and Provider Scope
      body: Use only OAuth access already resolved by Pi. Never persist, log, or expose credentials. Remain inactive without OAuth access, outside TUI mode, or when the selected provider is not OpenAI.
      approved_content_hash: 339daacb5e5fc6fd62d71810b4525097aebbc64d040720fcaca7619747b12d02
    - id: CC-2
      kind: cross_cutting
      title: Non-Disruptive Usage Freshness
      body: Usage-fetch failures must never interrupt an agent. Keep the last known usage visible and indicate staleness with a compact last-update age such as `5m ago`, rather than a verbose warning.
      approved_content_hash: 379fffefdcc08b948bed96b16e1aa7caf4173b1be1196d9a7a3e6aa5b55bd276
    - id: CC-3
      kind: cross_cutting
      title: Process-Local Ephemeral Scheduling
      body: Each Pi process owns its timers independently. Timers and paused-agent state remain in memory only, are not coordinated across sessions, and do not survive process termination.
      approved_content_hash: f76e07e585410a8a81dee45450204df72f5c10b0c3befef7fdba13709894b544
stories:
