    - id: US-3
      kind: story
      title: Resume Paused Agents in Order
      body: After the Continuation Timer expires, resume affected Paused Agent instances in Subagent-first order while minimizing additional model usage.
      status: done
      paths:
        - src/index.ts
        - src/paused.ts
        - tests/integration.test.ts
        - tests/paused.test.ts
      acceptance_criteria:
        - id: US-3.AC-1
          given: the Continuation Timer has expired and paused Subagents are known
          when: continuation begins
          then: Subagents receive Continuation Signals first
        - id: US-3.AC-2
          given: Continuation Signals for paused Subagents have been dispatched
          when: the main Paused Agent is also paused
          then: the main Paused Agent receives its Continuation Signal afterward
        - id: US-3.AC-3
          given: the Continuation Timer expires but no Paused Agent remains
          when: current state is checked
          then: no Continuation Signal or model request is triggered
        - id: US-3.AC-4
          given: a Paused Agent receives a Continuation Signal
          when: execution continues
          then: its Continuation Adapter preserves existing session context and work state without human intervention
      depends_on:
