trellis_export: 1
project:
    name: pi-openai-limits
    description: Global Pi TUI extension for OpenAI OAuth users that shows 5-hour and weekly usage/reset times and resumes quota-paused agents; inactive without Pi OAuth or on other providers.
    base_branch: develop
    release_branch: main
    lint_cmd: npx tsc --noEmit
    test_cmd: npx vitest run --reporter=junit --outputFile=reports/tests.xml --coverage.enabled --coverage.reporter=lcov --coverage.reportsDirectory=reports/coverage
    junit_glob: reports/*.xml
glossary:
    - term: Agent Handoff
      definition: Agent returns control to human.
    - term: Continuation Adapter
      definition: Session-bound function dispatching a Continuation Signal.
    - term: Continuation Signal
      definition: Minimal prompt that resumes a Paused Agent.
    - term: Continuation Timer
      definition: Process-local timer firing five minutes after a quota reset.
    - term: OpenAI Usage
      definition: Five-hour and weekly quota consumption with reset times.
    - term: Paused Agent
      definition: Main agent or Subagent awaiting quota-based continuation.
    - term: Pi OAuth Access
      definition: OpenAI OAuth access resolved and owned by Pi.
    - term: Refresh Cooldown
      definition: Five-minute minimum between OpenAI Usage refreshes.
    - term: Reset Window
      definition: OpenAI Usage window identified by duration and reset time.
    - term: Usage Snapshot
      definition: The last successfully fetched OpenAI Usage.
counters:
    AS: 3
    AT: 6
    CC: 3
    DD: 6
