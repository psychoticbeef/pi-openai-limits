      kind: story
      title: Display OpenAI Usage in the Status Bar
      body: Display five-hour and weekly OpenAI Usage, including reset times and freshness, in supported TUI sessions.
      status: done
      paths:
        - src/index.ts
        - src/snapshot.ts
        - src/usage.ts
        - tests/integration.test.ts
        - tests/smoke.test.ts
        - tests/snapshot.test.ts
        - tests/usage.test.ts
      acceptance_criteria:
        - id: US-1.AC-1
          given: a TUI session with an OpenAI model and existing Pi OAuth Access
          when: the session starts
          then: OpenAI Usage is fetched immediately and both limits and reset times are shown in the status bar
        - id: US-1.AC-2
          given: Pi OAuth Access is unavailable or a non-OpenAI model is selected
          when: the extension starts or the model changes
          then: it performs no OpenAI Usage request and displays no extension status
        - id: US-1.AC-3
          given: a prompt has been submitted or the agent is actively producing a response
          when: the Usage Snapshot can no longer be considered current
          then: the status bar clearly marks the displayed Usage Snapshot as stale until the next successful refresh
        - id: US-1.AC-4
          given: a stale Usage Snapshot and an upcoming Agent Handoff
          when: Agent Handoff occurs after the Refresh Cooldown
          then: OpenAI Usage is refreshed; during the Refresh Cooldown the cached Usage Snapshot remains visible and stale without another request
